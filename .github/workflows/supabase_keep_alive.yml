name: Supabase Keep-Alive Ping (Prevent Inactivity Pause)

on:
  schedule:
    # รันอัตโนมัติทุกวัน เวลา 04:00 UTC (11:00 น. เวลาไทย) เพื่อไม่ให้ฐานข้อมูลหยุดทำงาน
    - cron: '0 4 * * *'
  workflow_dispatch: # อนุญาตให้กดสั่ง Ping ด้วยมือได้ตลอดเวลาจาก GitHub Actions

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Keep-Alive Ping to Supabase Database Engine
        run: |
          echo "🚀 Sending Daily Keep-Alive Ping to Supabase at $(date -u)"
          
          # ส่งคำขอแบบ Bypass Cache เพื่อกระตุ้น PostgreSQL Engine ของ Supabase โดยตรง
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://undafgcijvuhvdmyjatk.supabase.co/rest/v1/assets?select=asset_id&limit=1" \
            -H "apikey: sb_publishable_WGFEQiopY91Fxi5o_-McKw_iwTRS5yn" \
            -H "Authorization: Bearer sb_publishable_WGFEQiopY91Fxi5o_-McKw_iwTRS5yn" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            -H "Pragma: no-cache" \
            -H "User-Agent: GitHub-Actions-SmartCAD-KeepAlive/2.3.0")
          
          echo "📡 HTTP Response Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
            echo "✅ Supabase is ACTIVE and Keep-Alive signal was received successfully."
          elif [ "$STATUS_CODE" -eq 522 ] || [ "$STATUS_CODE" -eq 503 ]; then
            echo "⚠️ Supabase is currently PAUSED (Status: $STATUS_CODE). Please visit Supabase Dashboard and click 'Restore project'."
            exit 1
          else
            echo "⚠️ Unexpected status code: $STATUS_CODE"
            exit 1
          fi
